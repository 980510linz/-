'use strict';
const $=s=>document.querySelector(s);const main=$('#main');
/* ===== SIGN WELL Live Sync · 前台端 =====================================
   資料來源有兩個，優先序如下：
     1. 本機快照 localStorage['signwell-public-live-v1']
        —— 由同一瀏覽器的 admin.html 在發布 / 刪除時寫入，只有你自己看得到
     2. articles.js 裡的 window.BLOG_ARTICLES
        —— 已部署的正式內容，所有訪客看到的就是這個
   當 articles.js 的 BLOG_BUILD_AT 比快照還新，代表你剛部署了新資料檔，
   此時快照視為過期並自動清除，避免舊的本機內容永遠蓋掉線上版本。 */
const LIVE_KEY='signwell-public-live-v1',LIVE_CHANNEL='signwell-live-sync';
const BUILD_AT=Number(window.BLOG_BUILD_AT||0);

function readSnapshot(){
  try{
    const raw=localStorage.getItem(LIVE_KEY);if(!raw)return null;
    const snap=JSON.parse(raw);
    if(!snap||!Array.isArray(snap.articles))return null;
    const at=Number(snap.updatedAt||0);
    if(BUILD_AT&&at<=BUILD_AT){localStorage.removeItem(LIVE_KEY);return null}
    return {at,articles:snap.articles};
  }catch(_){return null}
}
function loadArticles(){
  const snap=readSnapshot();
  if(snap){liveMode=true;liveStamp=snap.at;return snap.articles.filter(a=>a.status==='Published')}
  liveMode=false;liveStamp=0;
  return (window.BLOG_ARTICLES||[]).filter(a=>a.status==='Published');
}
let articles=loadArticles();
/* 後台改動進來時的處理：先重新載入資料，
   如果讀者正停在一篇剛被刪除／下架的文章上，就把他帶回首頁，不要留下死頁。 */
function applySync(notify=true){
  const prev=articles.length;
  articles=loadArticles();
  const r=route();
  if(r.page==='article'&&!articles.some(a=>a.slug===r.slug)){
    paintLiveBadge();
    if(notify)showToast('這篇文章已下架');
    if(location.hash.replace(/^#/,'')==='home')render();else navTo('home');
    return;
  }
  render();paintLiveBadge();
  if(notify)showToast(articles.length===prev?'內容已更新':'文章列表已同步（'+articles.length+' 篇）');
}
function paintLiveBadge(){
  const el=$('#liveBadge');if(!el)return;
  el.hidden=!liveMode;
  if(liveMode)el.textContent='本機預覽 · '+articles.length+' 篇 · 尚未部署';
}
const state={topic:'All'};
function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function inlineMD(s){return escapeHTML(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function renderMarkdown(md=''){
  const lines=md.replace(/\r/g,'').split('\n');let out='',list=null;
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(let i=0;i<lines.length;i++){
    const raw=lines[i],line=raw.trim();if(!line){close();continue}
    const call=line.match(/^> \[!(PEARL|KEY|WARNING)\]/i);if(call){close();const kind=call[1].toLowerCase();const next=(lines[++i]||'').replace(/^>\s?/, '');const label=kind==='pearl'?'Clinical Pearl':kind==='key'?'Key Point':'Warning';out+=`<div class="callout ${kind}"><b>${label}</b><p>${inlineMD(next)}</p></div>`;continue}
    if(/^###\s+/.test(line)){close();out+=`<h3>${inlineMD(line.replace(/^###\s+/,''))}</h3>`;continue}
    if(/^##\s+/.test(line)){close();const t=line.replace(/^##\s+/,'');const id='sec-'+slugify(t);out+=`<h2 id="${id}">${inlineMD(t)}</h2>`;continue}
    if(/^>\s+/.test(line)){close();out+=`<blockquote>${inlineMD(line.replace(/^>\s+/,''))}</blockquote>`;continue}
    const ol=line.match(/^\d+\.\s+(.+)/);if(ol){if(list!=='ol'){close();list='ol';out+='<ol>'}out+=`<li>${inlineMD(ol[1])}</li>`;continue}
    const ul=line.match(/^[-*]\s+(.+)/);if(ul){if(list!=='ul'){close();list='ul';out+='<ul>'}out+=`<li>${inlineMD(ul[1])}</li>`;continue}
    close();out+=`<p>${inlineMD(line)}</p>`;
  }close();return out;
}
function sanitizeHTML(html=''){const doc=new DOMParser().parseFromString(`<div>${html}</div>`,'text/html');doc.querySelectorAll('script,style,iframe,object,embed,form,input,button,meta,link').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim();if(n.startsWith('on'))el.removeAttribute(a.name);if((n==='href'||n==='src')&&/^javascript:/i.test(v))el.removeAttribute(a.name);if(n==='style'&&/expression|javascript:/i.test(v))el.removeAttribute(a.name)});if(el.tagName==='A'){el.setAttribute('rel','noopener noreferrer');if(el.getAttribute('href')?.startsWith('http'))el.setAttribute('target','_blank')}});const root=doc.body.firstElementChild;let i=0;root.querySelectorAll('h2,h3').forEach(h=>{if(!h.id)h.id='section-'+(++i)});return root.innerHTML}
function renderContent(a){return a?.contentFormat==='html'?sanitizeHTML(a.content||''):renderMarkdown(a?.content||'')}
function textExcerpt(a){if(a.excerpt)return a.excerpt;const el=document.createElement('div');el.innerHTML=renderContent(a);return (el.textContent||'').replace(/\s+/g,' ').trim().slice(0,170)}
function slugify(s){return String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,60)}
function readingTime(a){const el=document.createElement('div');el.innerHTML=renderContent(a);const chars=(el.textContent||'').replace(/\s+/g,'').length;return Math.max(1,Math.round(chars/450))}
function route(hash=location.hash){const h=(hash||'#home').replace(/^#/,'');if(h.startsWith('article/'))return {page:'article',slug:decodeURIComponent(h.slice(8))};if(h.startsWith('topic/'))return {page:'home',topic:decodeURIComponent(h.slice(6))};if(h==='about')return {page:'about'};if(h==='topics')return {page:'home',topics:true};return {page:'home'}}
function navTo(h){location.hash=h}
function articleCard(a){return `<article class="article-card" data-open="${escapeHTML(a.slug)}">${a.cover?`<div class="card-cover"><img src="${a.cover}" alt="" loading="lazy"></div>`:''}<div class="kicker">${escapeHTML(a.category||'Medical Notes')} · ${escapeHTML(a.type||'Article')}</div><h3>${escapeHTML(a.title)}</h3><p>${escapeHTML(textExcerpt(a))}</p><div class="meta"><span>${escapeHTML(a.publishedAt||'')}</span><span>${readingTime(a)} min read</span></div></article>`}
function renderHome(opts={}){state.topic=opts.topic||'All';const topics=['All',...new Set(articles.map(a=>a.category))];const featured=articles.find(a=>a.featured)||articles[0];const filtered=state.topic==='All'?articles:articles.filter(a=>a.category===state.topic);main.innerHTML=`<div class="shell"><section class="home-hero"><div><div class="eyebrow"><i></i>SIGN WELL BIOMED · 欣緯生醫</div><h1>把臨床問題，<br>寫成值得留下的答案。</h1><p class="hero-sub">臨床筆記、醫學推理、醫療科技與自費醫療觀察。不是追求資訊最多，而是把真正值得記住的框架整理清楚。</p></div><aside class="hero-note glass"><b>Medical notes,<br>clinical reasoning,<br>and things worth remembering.</b><p>以閱讀品質為核心的個人醫學出版空間。從床邊問題出發，保留推理脈絡與可回顧的知識。</p><div class="tiny">Independent medical journal</div></aside></section>${featured?`<div class="section-head"><div><p>EDITOR'S PICK</p><h2>Featured Clinical Note</h2></div><p>${articles.length} published notes</p></div><article class="featured glass" data-open="${escapeHTML(featured.slug)}"><div class="featured-art" ${featured.cover?`style="background-image:url('${featured.cover.replace(/'/g,"%27")}');background-size:cover;background-position:center"`:''}></div><div class="featured-copy"><div class="kicker">${escapeHTML(featured.category||'Medical Notes')} · ${escapeHTML(featured.type||'Article')}</div><h3>${escapeHTML(featured.title)}</h3><p>${escapeHTML(textExcerpt(featured))}</p><div class="meta"><span>${escapeHTML(featured.publishedAt)}</span><span>${readingTime(featured)} min read</span><span>${escapeHTML((featured.tags||[]).slice(0,2).join(' · '))}</span></div></div></article>`:''}<div class="section-head" id="topics"><div><p>KNOWLEDGE MAP</p><h2>Topics</h2></div><p>依臨床領域瀏覽</p></div><div class="topic-row">${topics.map(t=>`<button class="topic ${t===state.topic?'active':''}" data-topic="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('')}</div><div class="section-head"><div><p>RECENTLY STUDIED</p><h2>${state.topic==='All'?'Latest Articles':escapeHTML(state.topic)}</h2></div><p>${filtered.length} articles</p></div><section class="article-list">${filtered.length?filtered.map(articleCard).join(''):'<div class="empty">目前沒有這個分類的文章。</div>'}</section></div>`;bindHome();if(opts.topics)setTimeout(()=>$('#topics')?.scrollIntoView({behavior:'smooth'}),60)}
function bindHome(){document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>navTo('article/'+encodeURIComponent(el.dataset.open)));document.querySelectorAll('[data-topic]').forEach(el=>el.onclick=()=>navTo('topic/'+encodeURIComponent(el.dataset.topic==='All'?'All':el.dataset.topic)))}
function renderArticle(slug){const a=articles.find(x=>x.slug===slug);if(!a){main.innerHTML='<div class="about"><div class="about-panel"><h1>找不到文章</h1><p>這篇文章可能尚未發布或網址已改變。</p></div></div>';return}const html=renderContent(a);const parser=document.createElement('div');parser.innerHTML=html;const heads=[...parser.querySelectorAll('h2')].map(h=>({id:h.id,text:h.textContent}));main.innerHTML=`<article class="article-view"><header class="article-top"><div class="kicker">${escapeHTML(a.category||'Medical Notes')} · ${escapeHTML(a.type||'Article')}</div><h1>${escapeHTML(a.title)}</h1><div class="article-meta"><span>SIGN WELL · 欣緯生醫</span><span>${escapeHTML(a.publishedAt||'')}</span>${a.updatedAt&&a.updatedAt!==a.publishedAt?`<span>Updated ${escapeHTML(a.updatedAt)}</span>`:''}<span>${readingTime(a)} min read</span></div><div class="article-actions"><button class="pillbtn" id="shareArticle">分享</button><button class="pillbtn" id="copyArticle">複製連結</button></div></header>${a.cover?`<div class="article-cover"><img src="${a.cover}" alt="${escapeHTML(a.title)}"></div>`:''}<div class="article-layout"><div class="article-body">${html}</div><aside class="toc"><div class="toc-title">On this page</div>${heads.map(h=>`<button data-toc="${escapeHTML(h.id)}">${escapeHTML(h.text)}</button>`).join('')}</aside></div></article>`;document.querySelectorAll('[data-toc]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.toc)?.scrollIntoView({behavior:'smooth',block:'start'}));$('#copyArticle').onclick=()=>copyLink();$('#shareArticle').onclick=()=>shareArticle(a);setupToc();window.scrollTo({top:0})}
function renderAbout(){main.innerHTML=`<section class="about"><div class="about-panel glass"><div class="eyebrow"><i></i>ABOUT SIGN WELL</div><h1>欣緯生醫</h1><p>一個以臨床推理、醫學教育與自費醫療觀察為核心的個人出版空間。網站內容希望保留「為什麼」而不只留下答案，讓每篇筆記都能在下一次遇到病人或問題時真正派上用場。</p><div class="about-grid"><div class="about-item"><span>Focus</span><strong>Clinical Reasoning</strong></div><div class="about-item"><span>Format</span><strong>Notes · Deep Dives</strong></div><div class="about-item"><span>Principle</span><strong>Clear > Complicated</strong></div></div><p style="margin-top:30px">Medical disclaimer：本站內容僅供醫學教育與資訊整理，不構成個別醫療建議，也不能取代正式臨床評估與專業診療。</p></div></section>`;window.scrollTo({top:0})}
function render(){const r=route();$('#readingProgress').style.width='0';if(r.page==='article')renderArticle(r.slug);else if(r.page==='about')renderAbout();else renderHome({topic:r.topic==='All'?undefined:r.topic,topics:r.topics})}
function setupToc(){const buttons=[...document.querySelectorAll('[data-toc]')];const heads=buttons.map(b=>document.getElementById(b.dataset.toc)).filter(Boolean);if(!heads.length)return;const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){buttons.forEach(b=>b.classList.toggle('active',b.dataset.toc===e.target.id))}})},{rootMargin:'-20% 0px -70% 0px'});heads.forEach(h=>obs.observe(h))}
function showToast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),1700)}
async function copyLink(){try{await navigator.clipboard.writeText(location.href);showToast('已複製連結')}catch(_){showToast('請手動複製網址')}}
async function shareArticle(a){try{if(navigator.share){await navigator.share({title:a.title,text:textExcerpt(a),url:location.href});return}}catch(e){if(e?.name==='AbortError')return}copyLink()}
function plainSearch(a){const el=document.createElement('div');el.innerHTML=renderContent(a);return el.textContent||''}
function openSearch(){const o=$('#searchOverlay');o.classList.add('show');$('#searchInput').value='';renderSearch('');setTimeout(()=>$('#searchInput').focus(),40)}function closeSearch(){$('#searchOverlay').classList.remove('show')}
function renderSearch(q){const query=q.trim().toLowerCase();const found=!query?articles.slice(0,6):articles.filter(a=>[a.title,textExcerpt(a),a.category,(a.tags||[]).join(' '),plainSearch(a)].join(' ').toLowerCase().includes(query)).slice(0,10);$('#searchResults').innerHTML=found.length?found.map(a=>`<div class="search-result" data-search-open="${escapeHTML(a.slug)}"><strong>${escapeHTML(a.title)}</strong><span>${escapeHTML(a.category)} · ${readingTime(a)} min read</span></div>`).join(''):'<div class="empty">沒有符合的文章。</div>';document.querySelectorAll('[data-search-open]').forEach(el=>el.onclick=()=>{closeSearch();navTo('article/'+encodeURIComponent(el.dataset.searchOpen))})}
function applyTheme(){const pref=localStorage.getItem('signwell-theme')||'system';const dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.body.classList.toggle('dark',dark)}
function toggleTheme(){const dark=document.body.classList.contains('dark');localStorage.setItem('signwell-theme',dark?'light':'dark');applyTheme()}
function optimizePerformance(){const lowMem=Number(navigator.deviceMemory||8)<4;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;const compact=innerWidth<480;if(lowMem||reduce||compact&&navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)document.body.classList.add('lite')}
$('#brandHome').onclick=()=>navTo('home');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>navTo(b.dataset.route));$('#searchBtn').onclick=openSearch;$('#searchClose').onclick=closeSearch;$('#searchOverlay').onclick=e=>{if(e.target===$('#searchOverlay'))closeSearch()};$('#searchInput').oninput=e=>renderSearch(e.target.value);$('#themeBtn').onclick=toggleTheme;window.addEventListener('hashchange',render);window.addEventListener('storage',e=>{if(e.key===LIVE_KEY)applySync()});try{const bus=new BroadcastChannel(LIVE_CHANNEL);bus.onmessage=e=>{if(e.data&&e.data.type==='sync')applySync()}}catch(_){}document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const s=readSnapshot();if((s?s.at:0)!==liveStamp)applySync(false)});$('#liveBadge').onclick=()=>{try{localStorage.removeItem(LIVE_KEY)}catch(_){}articles=loadArticles();render();paintLiveBadge();showToast('已改用已部署的 articles.js')};window.addEventListener('scroll',()=>{const doc=document.documentElement;const max=doc.scrollHeight-innerHeight;const p=max>0?scrollY/max*100:0;$('#readingProgress').style.width=p+'%'},{passive:true});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeSearch()});
applyTheme();optimizePerformance();render();paintLiveBadge();setTimeout(()=>$('#splash').classList.add('out'),900);setTimeout(()=>$('#splash')?.remove(),1550);
})();
</script>
