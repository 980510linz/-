<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$('#app');
const DEFAULT_SITE_TEXT={siteTitle:'SIGN WELL · 欣緯生醫',brandEnglish:'SIGN WELL',brandChinese:'欣緯生醫',homeEyebrow:'SIGN WELL BIOMED · 欣緯生醫',homeTitle1:'從臨床出發，',homeTitle2:'把值得留下的醫學寫清楚。',homeSubtitle:'以臨床推理、醫學教育與自費醫療觀察為核心的知識平台。從一個問題開始，整理成下一次真正用得上的答案。',homeCardTitle:'醫學不只是答案，而是理解答案從哪裡來。',homeCardBody:'把床邊問題、閱讀與思考整理成可回顧的知識，讓資訊回到臨床情境。',dailyEyebrow:'每日更新',dailyTitle:'每日新文章',dailyDescription:'最新整理與近期發布',topicsEyebrow:'主題探討',topicsTitle:'從一個主題，深入理解一整套問題。',topicsSubtitle:'依領域整理文章、臨床問題與延伸閱讀。',shareEyebrow:'分享我們',shareTitle:'把 SIGN WELL 分享給需要的人。',shareSubtitle:'複製網站連結，或使用 QR Code 讓另一台裝置快速開啟。',articleCountSuffix:'篇文章',minutesReadSuffix:'分鐘閱讀',shareLabel:'分享',copyLinkLabel:'複製連結',tocTitle:'本頁內容',footerTagline:'臨床筆記、醫學推理，以及值得留下的知識。',footerDisclaimer:'本站內容僅供醫學教育與資訊整理，不構成個別醫療建議；實際診療應依臨床情境與專業醫療評估。',searchPlaceholder:'搜尋文章、主題、關鍵字…'};
const siteText={...DEFAULT_SITE_TEXT,...(window.SIGNWELL_SITE_TEXT||{})};const t=(k,fb='')=>siteText[k]??fb;
let articles=[],topics=[],articleCache=new Map(),articleIndexMode=false;
function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function slugify(s=''){return String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,70)}
function parseLegacy(text=''){const m=String(text).match(/window\.BLOG_ARTICLES\s*=\s*([\s\S]*);\s*$/);if(!m)return[];try{return JSON.parse(m[1]).filter(x=>x&&x.status==='Published')}catch(_){return[]}}
async function loadArticles(){try{const r=await fetch('articles/index.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const a=await r.json();articles=a.filter(x=>x&&x.status==='Published');articleIndexMode=true}catch(_){try{const r=await fetch('articles.js?v='+Date.now(),{cache:'no-store'});articles=parseLegacy(await r.text())}catch(__){articles=[]}}articles.sort((a,b)=>String(b.publishedAt||'').localeCompare(String(a.publishedAt||'')))}
async function loadTopics(){try{const r=await fetch('topics/index.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const a=await r.json();topics=Array.isArray(a)?a.filter(x=>x&&x.active!==false):[]}catch(_){topics=[]}if(!topics.length){const seen=new Set();topics=articles.map(a=>a.category).filter(Boolean).filter(n=>!seen.has(n)&&seen.add(n)).map((name,i)=>({id:'auto-'+i,name,slug:slugify(name),description:'瀏覽 '+name+' 相關文章與延伸整理。',order:i,active:true}))}topics.sort((a,b)=>(a.order??999)-(b.order??999)||String(a.name).localeCompare(String(b.name),'zh-Hant'))}
async function getFullArticle(slug){if(articleCache.has(slug))return articleCache.get(slug);const meta=articles.find(a=>a.slug===slug);if(!meta)return null;if(meta.content){articleCache.set(slug,meta);return meta}try{const file=meta.file||`articles/${encodeURIComponent(slug)}.json`,r=await fetch(file+'?v='+encodeURIComponent(meta.revision||''),{cache:'no-store'});if(!r.ok)throw 0;const full={...meta,...await r.json()};articleCache.set(slug,full);return full}catch(_){return meta}}
function sanitizeHTML(html=''){const d=new DOMParser().parseFromString(`<div>${html}</div>`,'text/html');d.querySelectorAll('script,style,iframe,object,embed,form,input,button,meta,link').forEach(n=>n.remove());d.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith('on')||((a.name==='src'||a.name==='href')&&/^javascript:/i.test(a.value)))el.removeAttribute(a.name)}));let i=0;d.body.querySelectorAll('h2,h3').forEach(h=>{if(!h.id)h.id='sec-'+(++i)});return d.body.firstElementChild?.innerHTML||''}
function renderContent(a){return sanitizeHTML(a?.content||'')}
function excerpt(a){if(a.excerpt)return a.excerpt;const d=document.createElement('div');d.innerHTML=a.content?renderContent(a):'';return(d.textContent||a.searchText||'').replace(/\s+/g,' ').trim().slice(0,150)}
function readingTime(a){return Number(a.readingTime)||Math.max(1,Math.round((a.searchText||excerpt(a)).replace(/\s/g,'').length/450))}
function applyChrome(){document.title=t('siteTitle');$('#brandEnglish').textContent=t('brandEnglish');$('#brandChinese').textContent=t('brandChinese');$('#footerBrand').textContent=t('siteTitle');$('#footerTagline').textContent=t('footerTagline');$('#footerDisclaimer').textContent=t('footerDisclaimer');$('#searchInput').placeholder=t('searchPlaceholder')}
function route(){const h=(location.hash||'').replace(/^#/,'');if(h.startsWith('article/'))return{page:'article',slug:decodeURIComponent(h.slice(8))};if(h.startsWith('topic/'))return{page:'topicDetail',slug:decodeURIComponent(h.slice(6))};const base=document.body.dataset.page||'home';return{page:base}}
function routeIndex(r){return r.page==='topics'||r.page==='topicDetail'?1:r.page==='share'?2:0}
function goto(page){if(page==='home'){location.href='index.html';return}if(page==='topics'){location.href='topics.html';return}if(page==='share'){location.href='share.html';return}if(page.startsWith('article/')){location.href='index.html#'+page;return}if(page.startsWith('topic/')){location.href='topics.html#'+page;return}}
function articleUrl(slug){const u=new URL('index.html',location.href);u.search='';u.hash='article/'+encodeURIComponent(slug);return u.href}
function setNav(index,instant=false){$$('.nav-item').forEach((b,i)=>b.classList.toggle('active',i===index));const thumb=$('#navThumb');if(instant)thumb.style.transition='none';thumb.style.transform=`translateY(${index*72}px)`;if(instant)requestAnimationFrame(()=>thumb.style.transition='')}
function articleCard(a){return `<article class="article-card glass" data-open="${escapeHTML(a.slug)}">${a.cover?`<div class="card-cover"><img src="${escapeHTML(a.cover)}" alt="" loading="lazy"></div>`:''}<div class="kicker">${escapeHTML(a.category||'醫學筆記')} · ${escapeHTML(a.type||'文章')}</div><h3>${escapeHTML(a.title||'未命名文章')}</h3><p>${escapeHTML(excerpt(a))}</p><div class="meta"><span>${escapeHTML(a.publishedAt||'')}</span><span>${readingTime(a)} ${escapeHTML(t('minutesReadSuffix'))}</span></div></article>`}
function bindArticleCards(){$$('[data-open]').forEach(el=>el.onclick=()=>goto('article/'+encodeURIComponent(el.dataset.open)))}
function topicCount(tp){return articles.filter(a=>a.category===tp.name||slugify(a.category||'')===tp.slug).length}
function renderHome(){const latest=articles.slice(0,9);app.innerHTML=`<div class="shell"><section class="hero"><div><div class="eyebrow"><i></i>${escapeHTML(t('homeEyebrow'))}</div><h1>${escapeHTML(t('homeTitle1'))}<br>${escapeHTML(t('homeTitle2'))}</h1><p class="hero-sub">${escapeHTML(t('homeSubtitle'))}</p><a class="scroll-cue" href="#daily" onclick="event.preventDefault();document.getElementById('daily').scrollIntoView({behavior:'smooth'})"><i></i><span>向下閱讀最新文章</span></a></div><aside class="hero-card glass"><b>${escapeHTML(t('homeCardTitle'))}</b><p>${escapeHTML(t('homeCardBody'))}</p><div class="tiny">SIGN WELL · 欣緯生醫</div></aside></section><section class="section" id="daily"><div class="section-head"><div><p>${escapeHTML(t('dailyEyebrow'))}</p><h2>${escapeHTML(t('dailyTitle'))}</h2></div><p>${escapeHTML(t('dailyDescription'))}</p></div><div class="article-grid">${latest.length?latest.map(articleCard).join(''):'<div class="empty">目前尚未發布文章。</div>'}</div></section></div>`;bindArticleCards();initReveal()}
function renderTopics(){app.innerHTML=`<div class="shell"><section class="page-hero"><div class="eyebrow"><i></i>${escapeHTML(t('topicsEyebrow'))}</div><h1>${escapeHTML(t('topicsTitle'))}</h1><p>${escapeHTML(t('topicsSubtitle'))}</p></section><section class="topic-grid">${topics.length?topics.map((tp,i)=>`<article class="topic-card glass" data-topic-open="${escapeHTML(tp.slug)}"><div class="topic-no">${String(i+1).padStart(2,'0')} · ${topicCount(tp)} ${escapeHTML(t('articleCountSuffix'))}</div><h3>${escapeHTML(tp.name)}</h3><p>${escapeHTML(tp.description||'瀏覽這個主題的相關文章與延伸整理。')}</p><div class="topic-count">進入主題 →</div></article>`).join(''):'<div class="empty">目前尚未建立主題。</div>'}</section></div>`;$$('[data-topic-open]').forEach(el=>el.onclick=()=>goto('topic/'+encodeURIComponent(el.dataset.topicOpen)));initReveal()}
function renderTopicDetail(slug){const tp=topics.find(x=>x.slug===slug)||{name:decodeURIComponent(slug),slug,description:''};const list=articles.filter(a=>a.category===tp.name||slugify(a.category||'')===tp.slug);app.innerHTML=`<div class="shell"><section class="page-hero"><button class="backlink" onclick="location.href='topics.html'">← 返回主題探討</button><div class="eyebrow" style="margin-top:26px"><i></i>主題探討</div><div class="topic-detail-head"><div><h1>${escapeHTML(tp.name)}</h1><p>${escapeHTML(tp.description||'')}</p></div><p>${list.length} ${escapeHTML(t('articleCountSuffix'))}</p></div></section><section class="article-grid">${list.length?list.map(articleCard).join(''):'<div class="empty">這個主題目前尚未有公開文章。</div>'}</section></div>`;bindArticleCards();initReveal()}
function renderShare(){const url=location.origin+location.pathname.replace(/[^/]*$/,'');app.innerHTML=`<div class="shell share-wrap"><section class="share-card glass"><div class="share-grid"><div><div class="eyebrow"><i></i>${escapeHTML(t('shareEyebrow'))}</div><h1>${escapeHTML(t('shareTitle'))}</h1><p>${escapeHTML(t('shareSubtitle'))}</p><div class="share-url"><input id="shareUrl" value="${escapeHTML(url)}" readonly><button class="primarybtn" id="copySite">複製</button></div><div class="share-actions"><button class="softbtn" id="nativeShare">系統分享</button><button class="softbtn" id="refreshQr">重新產生 QR Code</button></div></div><div class="qr-box" id="qrcode"><div class="qr-fallback">正在產生 QR Code…</div></div></div></section></div>`;$('#copySite').onclick=()=>copyText(url);$('#nativeShare').onclick=async()=>{try{if(navigator.share)await navigator.share({title:t('siteTitle'),url});else await copyText(url)}catch(e){if(e?.name!=='AbortError')showToast('分享功能暫時無法使用')}};$('#refreshQr').onclick=()=>makeQR(url);makeQR(url);initReveal()}
function makeQR(url){const box=$('#qrcode');box.innerHTML='';if(window.QRCode){new QRCode(box,{text:url,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});return}setTimeout(()=>{if(window.QRCode){box.innerHTML='';new QRCode(box,{text:url,width:190,height:190});}else box.innerHTML='<div class="qr-fallback">QR Code 載入失敗，仍可使用上方「複製」分享連結。</div>'},700)}
async function renderArticle(slug){const a=await getFullArticle(slug);if(!a){app.innerHTML='<div class="shell"><div class="empty">找不到這篇文章，可能尚未發布或網址已更改。</div></div>';return}const html=renderContent(a),wrap=document.createElement('div');wrap.innerHTML=html;const heads=[...wrap.querySelectorAll('h2')].map(h=>({id:h.id,text:h.textContent}));app.innerHTML=`<article class="article-view"><header class="article-top"><button class="backlink" onclick="location.href='index.html'">← 返回首頁</button><div class="kicker" style="margin-top:24px">${escapeHTML(a.category||'醫學筆記')} · ${escapeHTML(a.type||'文章')}</div><h1>${escapeHTML(a.title||'未命名文章')}</h1><div class="article-meta"><span>SIGN WELL · 欣緯生醫</span><span>${escapeHTML(a.publishedAt||'')}</span><span>${readingTime(a)} ${escapeHTML(t('minutesReadSuffix'))}</span></div><div class="article-actions"><button class="pillbtn" id="shareArticle">${escapeHTML(t('shareLabel'))}</button><button class="pillbtn" id="copyArticle">${escapeHTML(t('copyLinkLabel'))}</button></div></header>${a.cover?`<div class="article-cover"><img src="${escapeHTML(a.cover)}" alt=""></div>`:''}<div class="article-layout"><div class="article-body">${html}</div><aside class="toc"><div class="toc-title">${escapeHTML(t('tocTitle'))}</div>${heads.map(h=>`<button data-toc="${escapeHTML(h.id)}">${escapeHTML(h.text)}</button>`).join('')}</aside></div></article>`;$$('[data-toc]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.toc)?.scrollIntoView({behavior:'smooth'}));const shareUrl=articleUrl(a.slug);$('#copyArticle').onclick=()=>copyText(shareUrl);$('#shareArticle').onclick=async()=>{try{if(navigator.share)await navigator.share({title:a.title,text:excerpt(a),url:shareUrl});else await copyText(shareUrl)}catch(e){if(e?.name!=='AbortError')showToast('分享功能暫時無法使用')}};document.title=`${a.title} · SIGN WELL`;initReveal();setupToc()}
async function render(){const r=route();setNav(routeIndex(r));app.classList.add('page-out');await new Promise(res=>setTimeout(res,130));if(r.page==='home')renderHome();else if(r.page==='topics')renderTopics();else if(r.page==='topicDetail')renderTopicDetail(r.slug);else if(r.page==='share')renderShare();else await renderArticle(r.slug);window.scrollTo({top:0,behavior:'auto'});app.classList.remove('page-out');app.classList.add('page-in');setTimeout(()=>app.classList.remove('page-in'),650)}
function initLiquidNav(){const rail=$('#liquidNav'),thumb=$('#navThumb'),buttons=$$('.nav-item');buttons.forEach((b,i)=>b.onclick=()=>goto(b.dataset.page));let startY=0,startIndex=0,dragging=false;const max=144;const pos=i=>i*72;thumb.addEventListener('pointerdown',e=>{dragging=true;startY=e.clientY;startIndex=routeIndex(route());thumb.classList.add('dragging');thumb.setPointerCapture(e.pointerId)});thumb.addEventListener('pointermove',e=>{if(!dragging)return;let y=Math.max(0,Math.min(max,pos(startIndex)+(e.clientY-startY)));thumb.style.transform=`translateY(${y}px)`;const nearest=Math.round(y/72);buttons.forEach((b,i)=>b.classList.toggle('active',i===nearest))});const end=e=>{if(!dragging)return;dragging=false;thumb.classList.remove('dragging');let m=new DOMMatrixReadOnly(getComputedStyle(thumb).transform),nearest=Math.max(0,Math.min(2,Math.round(m.m42/72)));goto(buttons[nearest].dataset.page);setNav(nearest)};thumb.addEventListener('pointerup',end);thumb.addEventListener('pointercancel',end);rail.addEventListener('wheel',e=>{e.preventDefault();const i=routeIndex(route()),next=Math.max(0,Math.min(2,i+(e.deltaY>0?1:-1)));goto(buttons[next].dataset.page)},{passive:false})}
function initTilt(){if(!matchMedia('(pointer:fine)').matches||document.body.classList.contains('lite'))return;document.addEventListener('pointermove',e=>{const el=e.target.closest('.hero-card,.article-card,.topic-card,.share-card');if(!el)return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;el.style.setProperty('--px',(x*100)+'%');el.style.setProperty('--py',(y*100)+'%');el.style.setProperty('--ry',((x-.5)*6)+'deg');el.style.setProperty('--rx',((.5-y)*4)+'deg')},{passive:true});document.addEventListener('pointerout',e=>{const el=e.target.closest?.('.hero-card,.article-card,.topic-card,.share-card');if(!el||e.relatedTarget&&el.contains(e.relatedTarget))return;el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')},{passive:true})}
function initReveal(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});app.querySelectorAll('.section-head,.article-card,.topic-card,.hero-card,.share-card,.article-cover').forEach((el,i)=>{el.classList.add('reveal');el.style.transitionDelay=Math.min(i%6,5)*45+'ms';io.observe(el)})}
function setupToc(){const bs=$$('[data-toc]'),hs=bs.map(b=>document.getElementById(b.dataset.toc)).filter(Boolean);if(!hs.length)return;const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)bs.forEach(b=>b.classList.toggle('active',b.dataset.toc===e.target.id))}),{rootMargin:'-20% 0px -70% 0px'});hs.forEach(h=>o.observe(h))}
function showToast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),1600)}
async function copyText(v){try{await navigator.clipboard.writeText(v);showToast('已複製連結')}catch(_){showToast('請長按網址手動複製')}}
function openSearch(){const ov=$('#searchOverlay');ov.classList.add('show');document.body.style.overflow='hidden';$('#searchInput').value='';renderSearch('');setTimeout(()=>$('#searchInput').focus(),80)}
function closeSearch(){$('#searchOverlay').classList.remove('show');document.body.style.overflow=''}
function searchArticleRow(a){return `<div class="search-result" data-search="${escapeHTML(a.slug)}"><div class="search-result-cover ${a.cover?'':'noimg'}">${a.cover?`<img src="${escapeHTML(a.cover)}" alt="" loading="lazy">`:'欣'}</div><div class="search-result-copy"><strong>${escapeHTML(a.title)}</strong><span>${escapeHTML(a.category||'醫學筆記')} · ${readingTime(a)} 分鐘閱讀${a.excerpt?' · '+escapeHTML(a.excerpt):''}</span></div><div class="search-result-arrow">›</div></div>`}
function searchTopicRow(tp){return `<div class="search-result search-topic-result" data-search-topic="${escapeHTML(tp.slug)}"><div class="search-topic-icon">主</div><div class="search-result-copy"><strong>${escapeHTML(tp.name)}</strong><span>${escapeHTML(tp.description||'瀏覽這個主題的相關文章與延伸整理。')} · ${topicCount(tp)} 篇</span></div><div class="search-result-arrow">›</div></div>`}
function renderSearch(q){const s=q.trim().toLowerCase();let foundArticles,foundTopics;if(!s){foundArticles=articles.slice(0,6);foundTopics=topics.slice(0,3);$('#searchHint').textContent='最近發布與主題';}else{foundArticles=articles.filter(a=>[a.title,a.category,(a.tags||[]).join(' '),a.searchText,excerpt(a)].join(' ').toLowerCase().includes(s)).slice(0,10);foundTopics=topics.filter(tp=>[tp.name,tp.description,tp.slug].join(' ').toLowerCase().includes(s)).slice(0,5);$('#searchHint').textContent=`搜尋「${q.trim()}」`;}const total=foundArticles.length+foundTopics.length;$('#searchCount').textContent=total?`${total} 個結果`:'';let html='';if(foundArticles.length)html+=`<div class="search-section-label">文章</div>${foundArticles.map(searchArticleRow).join('')}`;if(foundTopics.length)html+=`<div class="search-section-label">主題</div>${foundTopics.map(searchTopicRow).join('')}`;if(!total)html='<div class="search-empty">沒有找到符合的內容。<br>可以試試較短的關鍵字或主題名稱。</div>';$('#searchResults').innerHTML=html;$$('[data-search]').forEach(el=>el.onclick=()=>{closeSearch();goto('article/'+encodeURIComponent(el.dataset.search))});$$('[data-search-topic]').forEach(el=>el.onclick=()=>{closeSearch();goto('topic/'+encodeURIComponent(el.dataset.searchTopic))})}
function applyTheme(){const p=localStorage.getItem('signwell-theme')||'system',dark=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.body.classList.toggle('dark',dark)}function toggleTheme(){localStorage.setItem('signwell-theme',document.body.classList.contains('dark')?'light':'dark');applyTheme()}
function optimize(){if(Number(navigator.deviceMemory||8)<4||matchMedia('(prefers-reduced-motion:reduce)').matches||(innerWidth<480&&navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4))document.body.classList.add('lite')}
function initWelcome(){const el=$('#welcomeSplash');if(!el)return;const deep=route().page==='article';let seen=false;try{seen=sessionStorage.getItem('signwell-welcome-original-v1')==='1';if(!seen)sessionStorage.setItem('signwell-welcome-original-v1','1')}catch(_){seen=false}if(seen&&!deep){el.remove();return}setTimeout(()=>el.classList.add('out'),900);setTimeout(()=>el.remove(),1550)}
$('#brandHome').onclick=()=>goto('home');$('#searchBtn').onclick=openSearch;$('#searchClose').onclick=closeSearch;$('#searchOverlay').onclick=e=>{if(e.target===$('#searchOverlay'))closeSearch()};$('#searchInput').oninput=e=>renderSearch(e.target.value);$('#themeBtn').onclick=toggleTheme;document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}else if(e.key==='Escape'&&$('#searchOverlay').classList.contains('show'))closeSearch()});window.addEventListener('hashchange',render);window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;$('#readingProgress').style.width=(max>0?scrollY/max*100:0)+'%'},{passive:true});document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,.article-card,.topic-card');if(!b)return;b.classList.remove('jelly');void b.offsetWidth;b.classList.add('jelly');setTimeout(()=>b.classList.remove('jelly'),600)},{passive:true});
(async()=>{initWelcome();optimize();applyTheme();applyChrome();initLiquidNav();initTilt();await loadArticles();await loadTopics();setNav(routeIndex(route()),true);render()})();
})();
</script>
</body>
</html>
