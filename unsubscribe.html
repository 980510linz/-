<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<title>電子報設定 · SIGN WELL</title>
<script src="analytics-config.js"></script>
<style>
:root{
  --ink:#173044;--muted:#71899a;--line:rgba(255,255,255,.72);
  --serif:"Zen Old Mincho","Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{
  min-height:100dvh;display:grid;place-items:center;
  padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));
  color:var(--ink);font-family:var(--sans);
  background:
    radial-gradient(760px 460px at 4% -8%,rgba(255,255,255,.98),transparent 64%),
    radial-gradient(680px 430px at 103% 108%,rgba(126,194,236,.19),transparent 68%),
    linear-gradient(155deg,#fafcfe,#eef5fa 48%,#e5eff7);
}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;opacity:.44}
.o1{width:350px;height:350px;left:-140px;top:-120px;background:radial-gradient(circle,rgba(255,255,255,.96),rgba(176,220,247,.17) 58%,transparent 72%)}
.o2{width:400px;height:400px;right:-160px;bottom:-175px;background:radial-gradient(circle,rgba(136,203,242,.24),rgba(255,255,255,.06) 62%,transparent 74%)}
.card{
  width:min(560px,100%);position:relative;z-index:2;padding:34px 30px 28px;border:1px solid var(--line);border-radius:31px;
  background:radial-gradient(310px 150px at 10% 0%,rgba(255,255,255,.80),transparent 72%),linear-gradient(145deg,rgba(255,255,255,.43),rgba(224,242,254,.12));
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 30px 84px rgba(60,102,132,.12),inset 0 1px 0 rgba(255,255,255,.92);text-align:center;
}
.brand{font:900 11px/1 var(--sans);letter-spacing:.16em;color:#5d7e94}
.icon{
  width:64px;height:64px;margin:23px auto 18px;border-radius:22px;display:grid;place-items:center;color:#4b8db8;
  background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(207,234,251,.42));border:1px solid rgba(255,255,255,.90);
  box-shadow:0 14px 34px rgba(71,128,166,.10),inset 0 1px 0 #fff
}
.icon svg{width:28px;height:28px}
h1{margin:0;font-family:var(--serif);font-size:clamp(28px,7vw,42px);line-height:1.2;font-weight:900}
.copy{margin:13px auto 0;max-width:430px;color:var(--muted);font-size:14px;line-height:1.85;font-weight:700}
.keep-box{margin:22px 0 0;padding:17px;text-align:left;border-radius:20px;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.78)}
.keep-box strong{display:block;color:#496c83;font-size:12px}.keep-box ul{margin:9px 0 0;padding-left:18px;color:#7a909f;font-size:11px;line-height:1.75;font-weight:700}
.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:22px}
button,a{
  min-height:46px;padding:0 17px;border-radius:16px;border:1px solid rgba(255,255,255,.82);
  font:850 13px/1 var(--sans);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .16s ease,background .16s ease
}
button:active,a:active{transform:scale(.975)}
.primary{color:#fff;background:linear-gradient(145deg,#5ba9d8,#407fa8);box-shadow:0 10px 24px rgba(63,126,168,.15),inset 0 1px 0 rgba(255,255,255,.28)}
.secondary{color:#54768b;background:rgba(255,255,255,.30)}.danger-soft{color:#8b6666;background:rgba(255,247,247,.42)}
.hidden{display:none!important}.reason-panel{margin-top:22px;text-align:left}.reason-title{color:#59778b;font-size:11px;font-weight:900;margin-bottom:10px}
.reason-list{display:grid;gap:8px}
.reason-option{
  display:flex;align-items:center;gap:10px;min-height:46px;padding:11px 13px;border-radius:16px;
  background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.68);color:#667f90;font-size:11px;font-weight:800;cursor:pointer
}
.reason-option input{accent-color:#5b9dca}
.reason-option:has(input:checked){color:#416d89;background:rgba(226,245,255,.58);border-color:rgba(133,194,230,.38);box-shadow:0 6px 18px rgba(72,128,166,.07),inset 0 1px 0 #fff}
textarea{
  width:100%;min-height:82px;margin-top:10px;padding:12px 13px;resize:vertical;border-radius:16px;border:1px solid rgba(255,255,255,.72);outline:0;
  background:rgba(255,255,255,.34);color:#526f82;font:700 11px/1.7 var(--sans)
}
textarea:focus{box-shadow:0 0 0 4px rgba(92,160,204,.08)}
.skip{margin:10px auto 0;display:block;min-height:auto;padding:4px 8px;border:0;background:transparent;color:#9aa9b2;font-size:10px}
.email{display:none;margin:15px auto 0;width:max-content;max-width:100%;padding:8px 12px;border-radius:999px;color:#55778d;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.72);font-size:12px;font-weight:800}
.email.show{display:block}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(83,143,182,.17);border-top-color:#5a9ec9;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{margin-top:20px;padding-top:17px;border-top:1px solid rgba(130,167,192,.16);color:#9aabb6;font-size:10px;line-height:1.7;font-weight:700}
@media(max-width:620px){body{place-items:start center;padding-top:max(34px,env(safe-area-inset-top))}.card{padding:29px 20px 23px;border-radius:27px}.actions{grid-template-columns:1fr}.o1,.o2{opacity:.32}}
@media(pointer:coarse){.card{-webkit-backdrop-filter:blur(10px) saturate(130%);backdrop-filter:blur(10px) saturate(130%)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}button,a{transition:none}}

/* ============================================================
   Public v17.8 · Mobile Centering + Dark Contrast
   ============================================================ */

/* Dark mode: lift both primary and secondary text contrast.
   A number of older components use hard-coded light-mode blue/gray text,
   so changing --muted alone is not enough. */
body.dark{
  --ink:#f4f8fb!important;
  --muted:#b8c8d4!important;
}

body.dark{
  color:var(--ink)!important;
}

body.dark :is(
  .brand-copy span,
  .hero-sub,
  .hero-card p,
  .hero-card .tiny,
  .section-head p,
  .article-card p,
  .meta,
  .page-hero p,
  .topic-no,
  .topic-card p,
  .topic-count,
  .backlink,
  .article-meta,
  .article-actions,
  .toc-title,
  .toc button,
  .footer,
  .search-title span,
  .search-kbd,
  .search-meta,
  .search-section-label,
  .search-result span,
  .search-empty,
  .newsletter-kicker,
  .newsletter-lead,
  .newsletter-consent,
  .newsletter-status,
  .newsletter-note,
  .about-manifesto p,
  .about-team-head p,
  .about-team-head > span,
  .about-value span,
  .person-kicker,
  .person-role,
  .person-bio,
  .person-history,
  .person-tag,
  .idle-subscribe-copy,
  .idle-subscribe-note,
  .nl-flow-copy,
  .nl-flow-email,
  .nl-success-sub,
  .newsletter-terms-kicker,
  .newsletter-terms-body,
  .newsletter-terms-note
){
  color:#b8c8d4!important;
}

body.dark :is(
  .article-card h3,
  .topic-card h3,
  .about-value b,
  .person-name,
  .idle-subscribe-title,
  .nl-flow-title,
  .newsletter-terms-title,
  .newsletter-terms-body h3
){
  color:#edf5fa!important;
}

body.dark .article-body{
  color:#e7f0f6!important;
}
body.dark .article-body :is(p,li,dd,dt){
  color:#e3edf4;
}
body.dark .article-body :is(strong,b){
  color:#ffffff;
}
body.dark .article-body mark,
body.dark .article-body span[style*="background-color"],
body.dark .article-body span[style*="background:"]{
  color:#f8fbfd!important;
}
body.dark .search-input input{
  color:#eef6fb!important;
}
body.dark .search-input input::placeholder,
body.dark .newsletter-form input::placeholder{
  color:#9fb2c1!important;
}
body.dark .newsletter-success{
  color:#b9ded0!important;
}
body.dark .newsletter-status.success{
  color:#9bd1bc!important;
}
body.dark .newsletter-status.error{
  color:#f2a8b1!important;
}
body.dark .share-url input{
  color:#edf5fa!important;
}
body.dark .backlink:hover,
body.dark .topic-card:hover .topic-count{
  color:#d7ebf9!important;
}

/* Mobile centering:
   older rules left #app at 28px while right remained 14px, which shifts
   the whole public canvas off visual center on phones. */
@media(max-width:700px){
  :root{
    --sw-mobile-gutter:16px;
  }

  html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  #app{
    width:100%!important;
    max-width:100%!important;
    margin-left:auto!important;
    margin-right:auto!important;
    padding-left:max(var(--sw-mobile-gutter),env(safe-area-inset-left))!important;
    padding-right:max(var(--sw-mobile-gutter),env(safe-area-inset-right))!important;
  }

  .shell,
  .home-scroll-scene,
  .hero,
  .page-hero,
  .section,
  .article-view,
  .share-wrap,
  .newsletter-wrap,
  .about-wrap,
  .home-next-stage{
    width:100%!important;
    max-width:100%!important;
    margin-left:auto!important;
    margin-right:auto!important;
  }

  .article-grid,
  .topic-grid,
  .share-card,
  .newsletter-card,
  .people-grid{
    margin-left:auto!important;
    margin-right:auto!important;
  }

  .footer{
    width:calc(100% - (var(--sw-mobile-gutter) * 2))!important;
    margin-left:auto!important;
    margin-right:auto!important;
  }

  /* Header and bottom pager stay mathematically centered to viewport. */
  .brand-top{
    left:50%!important;
    right:auto!important;
    transform:translate3d(-50%,0,0)!important;
  }
  .brand-top:hover{
    transform:translate3d(-50%,-1px,0)!important;
  }
  .pager{
    left:50%!important;
    right:auto!important;
    transform:translateX(-50%)!important;
  }

  /* Prevent a wide child from making the content appear offset. */
  .hero > *,
  .section > *,
  .article-view > *,
  .page-hero > *{
    min-width:0;
    max-width:100%;
  }

  .share-card,
  .newsletter-card{
    width:100%!important;
  }
}

/* Slightly larger visual gutter on very narrow iPhones without asymmetry. */
@media(max-width:390px){
  :root{
    --sw-mobile-gutter:14px;
  }
}


/* ============================================================
   Public v18.2 · Stability + Performance
   ============================================================ */

/* Dark mode highlight readability: v17.8 was too aggressive for inline
   highlighted spans. Marks get an intentional high-contrast palette. */
body.dark .article-body mark{
  color:#17212d!important;
  background:
    linear-gradient(transparent 36%,rgba(255,225,101,.92) 36% 91%,transparent 91%)!important;
}
body.dark .article-body span[style*="background-color"],
body.dark .article-body span[style*="background:"]{
  color:inherit!important;
}

/* Hidden tabs should not keep animating the four ambient lights. */
body.sw-page-hidden .orb{
  animation-play-state:paused!important;
}

/* Keep the visual identity but reduce iOS compositing cost. */
@media(max-width:700px), (pointer:coarse){
  body{
    background-attachment:scroll!important;
  }
  .ambient{
    filter:blur(52px) saturate(126%)!important;
    opacity:.78!important;
  }
  .orb.d{
    opacity:.36!important;
  }
  .grain{
    opacity:.13!important;
  }
  .glass,
  .lightcard{
    backdrop-filter:blur(15px) saturate(145%)!important;
    -webkit-backdrop-filter:blur(15px) saturate(145%)!important;
  }
  button,
  a,
  input,
  label{
    touch-action:manipulation;
  }
}

/* Automatic low-fx for save-data / low-memory devices. */
html.sw-lowfx .ambient{
  filter:blur(38px) saturate(118%)!important;
  opacity:.70!important;
}
html.sw-lowfx .orb.c,
html.sw-lowfx .orb.d{
  animation:none!important;
}
html.sw-lowfx .cursor-glow{
  display:none!important;
}

/* Last-resort center guard: no public page can exceed the mobile viewport. */
@media(max-width:700px){
  #app,
  #app > *,
  .shell,
  .section,
  .article-view,
  .page-hero{
    min-width:0!important;
  }
  img,
  video,
  iframe{
    max-width:100%;
  }
}

/* Reduced-motion means readable immediately, not "animation but slower". */
@media(prefers-reduced-motion:reduce){
  .orb{animation:none!important}
  [class*="reveal"]{
    opacity:1!important;
    transform:none!important;
    translate:0!important;
    filter:none!important;
  }
}


/* ============================================================
   Public v18.2 · Overall Performance / UX / Accessibility
   ============================================================ */
html,body{
  overscroll-behavior-x:none;
}
h1,h2,h3{
  text-wrap:balance;
  overflow-wrap:anywhere;
}
p,li,figcaption{
  overflow-wrap:break-word;
}
body.sw-page-hidden .orb,
body.visual-paused .orb{
  animation-play-state:paused!important;
}

/* Better touch ergonomics without changing desktop density. */
@media (max-width:700px), (pointer:coarse){
  button,
  .pillbtn,
  .softbtn,
  .cta,
  .pager button,
  .top-actions button{
    min-height:44px;
    touch-action:manipulation;
  }
  input,select,textarea{
    font-size:16px!important;
  }
  .article-body{
    overflow-wrap:anywhere;
  }
}

/* Explicit high-contrast fallback. */
@media (prefers-contrast:more){
  body{--muted:#516779}
  body.dark{--muted:#d0dde6!important}
  .glass,.lightcard{
    border-color:rgba(97,133,162,.34)!important;
  }
}

/* Printing articles should be clean, white and ink-friendly. */
@media print{
  body{background:#fff!important;color:#111!important}
  .ambient,.grain,.cursor-glow,.brand-top,.top-actions,.pager,
  .reading-progress,.to-top,.article-actions,.toc,.footer,
  #welcomeSplash,#idleSubscribePrompt{display:none!important}
  #app,.article-view,.article-layout,.article-body{
    display:block!important;width:auto!important;max-width:none!important;
    margin:0!important;padding:0!important;box-shadow:none!important;
  }
  .article-body{color:#111!important}
  .article-body a{color:#111!important;text-decoration:underline!important}
}


/* ============================================================
   Public v18.2 · Apple Pastel Material + Spring Slider
   Palette: soft pink / soft green / soft blue / white
   ============================================================ */
:root{
  --sw-pink:#f6dfe6;
  --sw-pink-2:#faedf1;
  --sw-green:#dff0e8;
  --sw-green-2:#eef8f3;
  --sw-blue:#dfeeff;
  --sw-blue-2:#eef6ff;
  --sw-white:#fbfdff;

  --sky:#82b6f2;
  --sky-deep:#4e8fd8;
  --sky2:#cfe4fb;
  --sky3:#f3f8fe;

  --ink:#172334;
  --muted:#748497;
  --bg:#f5f8fb;

  --glass-tint-a:rgba(255,255,255,.78);
  --glass-tint-b:rgba(247,251,255,.48);
  --glass-rim:rgba(255,255,255,.98);
  --glass-rim-soft:rgba(209,225,239,.54);
  --glass-blur:24px;
  --glass-sat:155%;

  --shadow-soft:0 2px 7px rgba(61,84,110,.045);
  --shadow-lift:
    0 18px 48px rgba(63,96,126,.105),
    0 4px 14px rgba(63,96,126,.045);
  --shadow-hover:
    0 24px 62px rgba(63,96,126,.14),
    0 6px 18px rgba(63,96,126,.06);

  --apple-spring:cubic-bezier(.22,1.32,.36,1);
  --apple-soft:cubic-bezier(.2,.8,.2,1);
}

body{
  background:
    radial-gradient(68rem 46rem at -10% 2%,rgba(246,223,230,.68),transparent 56%),
    radial-gradient(58rem 46rem at 106% 2%,rgba(223,238,255,.92),transparent 58%),
    radial-gradient(58rem 44rem at 8% 102%,rgba(223,240,232,.72),transparent 56%),
    radial-gradient(56rem 48rem at 96% 94%,rgba(238,246,255,.90),transparent 58%),
    linear-gradient(155deg,#fbfdff 0%,#f5f8fb 48%,#eff5f9 100%) !important;
  background-attachment:fixed;
}

.ambient{
  filter:blur(90px) saturate(118%)!important;
  opacity:.72!important;
}
.orb.a{
  background:radial-gradient(circle,rgba(188,218,252,.48),transparent 68%)!important;
}
.orb.b{
  background:radial-gradient(circle,rgba(247,218,227,.42),transparent 68%)!important;
}
.orb.c{
  background:radial-gradient(circle,rgba(208,236,223,.36),transparent 68%)!important;
}
.orb.d{
  background:radial-gradient(circle,rgba(219,233,252,.34),transparent 70%)!important;
}
.grain{opacity:.10!important}

.glass,
.lightcard{
  background:
    linear-gradient(145deg,rgba(255,255,255,.80),rgba(247,251,255,.46))!important;
  border-color:rgba(255,255,255,.88)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(121,151,176,.055),
    var(--shadow-lift)!important;
  backdrop-filter:blur(24px) saturate(150%)!important;
  -webkit-backdrop-filter:blur(24px) saturate(150%)!important;
}

.glass::before{
  background:
    linear-gradient(
      150deg,
      rgba(255,255,255,1) 0%,
      rgba(222,238,253,.68) 32%,
      rgba(247,224,231,.30) 57%,
      rgba(224,241,233,.28) 76%,
      rgba(255,255,255,.96) 100%
    )!important;
}

/* Apple-like controls: quiet surface, hairline border, compact spring. */
.pillbtn,
.softbtn,
.backlink,
.newsletter-submit,
.share-copy,
.top-actions button,
.search-close,
.to-top{
  background:rgba(255,255,255,.62)!important;
  border-color:rgba(255,255,255,.92)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    0 8px 22px rgba(64,94,122,.08)!important;
  backdrop-filter:blur(18px) saturate(145%)!important;
  -webkit-backdrop-filter:blur(18px) saturate(145%)!important;
  transition:
    scale .22s var(--apple-spring),
    transform .28s var(--apple-soft),
    box-shadow .28s ease,
    background .28s ease!important;
}
.pillbtn:active,
.softbtn:active,
.backlink:active,
.newsletter-submit:active,
.share-copy:active,
.top-actions button:active{
  scale:.965;
}

.article-card,
.topic-card,
.person-card,
.share-card,
.newsletter-card,
.about-manifesto,
.hero-card{
  border-color:rgba(255,255,255,.90)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    0 18px 48px rgba(63,92,119,.085)!important;
}

/* Pink and green are accents, never competing at the same visual weight. */
.kicker,
.newsletter-kicker,
.topic-no{
  color:#6796c8!important;
}
.badge,
.chip{
  background:rgba(223,240,232,.52)!important;
  border-color:rgba(255,255,255,.84)!important;
}
.article-card:nth-child(4n+1)::after,
.topic-card:nth-child(4n+1)::after{
  background:radial-gradient(circle,rgba(246,223,230,.22),transparent 70%)!important;
}
.article-card:nth-child(4n+3)::after,
.topic-card:nth-child(4n+3)::after{
  background:radial-gradient(circle,rgba(223,240,232,.20),transparent 70%)!important;
}

/* ------------------------------------------------------------
   Liquid slider micro-interaction
   Instagram / Threads inspired: the lens gently grows while moving,
   then springs back without disturbing its translation.
   Individual CSS `scale` is independent from JS `transform`.
   ------------------------------------------------------------ */
.pager-thumb{
  scale:1;
  will-change:transform,scale!important;
  transition:
    scale .38s var(--apple-spring),
    box-shadow .28s ease!important;
}
body.pager-dragging .pager-thumb{
  scale:1.068;
  transition:
    scale .145s cubic-bezier(.2,.9,.3,1),
    box-shadow .18s ease!important;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.98),
    inset 0 -10px 22px -14px rgba(111,164,210,.36),
    0 15px 30px rgba(67,112,150,.18),
    0 1px 4px rgba(67,112,150,.11)!important;
}
body.pager-programmatic .pager-thumb,
.pager.nav-traveling .pager-thumb{
  scale:1.045;
  transition:
    scale .18s cubic-bezier(.2,.9,.3,1),
    box-shadow .22s ease!important;
}
.pager-thumb{
  background:
    radial-gradient(120% 100% at 26% 0%,rgba(255,255,255,.98),rgba(255,255,255,.34) 44%,transparent 72%),
    linear-gradient(155deg,rgba(249,252,255,.86),rgba(225,239,253,.42))!important;
}
.pager::before{
  background:
    conic-gradient(
      from var(--rim,140deg) at 50% 50%,
      rgba(255,255,255,.98),
      rgba(208,231,252,.44) 22%,
      rgba(247,221,229,.38) 42%,
      rgba(223,240,232,.34) 64%,
      rgba(255,255,255,.98)
    )!important;
}
.pager{
  background:
    linear-gradient(152deg,rgba(255,255,255,.48),rgba(249,252,255,.16) 48%,rgba(255,255,255,.34))!important;
  border:1px solid rgba(255,255,255,.62);
  box-shadow:
    0 20px 46px rgba(61,94,124,.13),
    inset 0 1px 1px rgba(255,255,255,.92),
    inset 0 -1px 0 rgba(112,150,181,.055)!important;
}

@media(max-width:700px),(pointer:coarse){
  body{
    background-attachment:scroll!important;
    background:
      radial-gradient(36rem 28rem at -8% 0%,rgba(246,223,230,.58),transparent 56%),
      radial-gradient(34rem 30rem at 108% 4%,rgba(223,238,255,.84),transparent 60%),
      radial-gradient(34rem 30rem at 4% 98%,rgba(223,240,232,.54),transparent 58%),
      linear-gradient(160deg,#fbfdff,#f4f8fb 52%,#eef4f8)!important;
  }

  .glass,
  .lightcard{
    backdrop-filter:blur(17px) saturate(142%)!important;
    -webkit-backdrop-filter:blur(17px) saturate(142%)!important;
  }

  /* slightly less enlargement on compact phones */
  body.pager-dragging .pager-thumb{scale:1.055}
  body.pager-programmatic .pager-thumb,
  .pager.nav-traveling .pager-thumb{scale:1.036}
}

@media(prefers-reduced-motion:reduce){
  .pager-thumb{scale:1!important;transition:none!important}
}

  --ink:#f4f7fb!important;

    radial-gradient(54rem 42rem at 108% 4%,rgba(64,103,146,.38),transparent 60%),
    radial-gradient(48rem 40rem at 4% 100%,rgba(66,104,92,.23),transparent 58%),

body.dark .lightcard{
  background:linear-gradient(145deg,rgba(38,49,63,.74),rgba(25,35,48,.56))!important;
  border-color:rgba(255,255,255,.12)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    0 18px 48px rgba(0,0,0,.24)!important;
}

<style id="signwell-typography-20260912">
/* ============================================================
   SIGN WELL · Typography 2026-09-12
   Scope: visual layer only. No application logic is changed.
   Microsoft JhengHei = body/editorial copy
   Yuanti / rounded fallback = headings, brand and controls
   ============================================================ */
:root{
  --sw-font-main:"Microsoft JhengHei","Microsoft JhengHei UI","微軟正黑體",sans-serif;
  --sw-font-round:"Yuanti TC","STYuanti-TC-Regular","Microsoft JhengHei UI","Microsoft JhengHei","微軟正黑體",sans-serif;
  --font-sans:var(--sw-font-main);
  --font-serif:var(--sw-font-round);
  --sans:var(--sw-font-main);
  --serif:var(--sw-font-round);
}

html,body,
body *,
button,input,textarea,select,option{
  font-family:var(--sw-font-main)!important;
}

h1,h2,h3,h4,h5,h6,
.splash-word,
.brand-mark,.brand-copy strong,.brand-title,.brand-name,
.eyebrow,.kicker,.page-title,.section-title,
.article-card h3,.topic-card h3,
.person-name,.person-card h3,
.newsletter-title,.newsletter-kicker,
.search-title,.share-title,
.about-manifesto h2,.about-team-head h2,
.idle-subscribe-title,.nl-flow-title,.newsletter-terms-title,
button,.pillbtn,.softbtn,.backlink,.newsletter-submit,.share-copy,
.search-close,.to-top,.nav-item,.badge,.chip,.tag{
  font-family:var(--sw-font-round)!important;
}

/* Keep the two-font system deterministic even when legacy declarations
   still contain Georgia, Times, SF Pro, PingFang or Mincho. */
code,pre,kbd,samp,.search-kbd,.content-area{
  font-family:var(--sw-font-main)!important;
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i></div>
<main class="card" role="main" aria-live="polite">
  <div class="brand">SIGN WELL · 欣緯生醫</div>
  <div class="icon" id="statusIcon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.8 12 12l8-5.2"/><rect x="3" y="5" width="18" height="14" rx="3"/></svg>
  </div>
  <section id="retentionStep">
    <h1>確定要離開嗎？</h1>
    <p class="copy">你可以繼續保留 SIGN WELL Letter。只有有值得寄出的內容時，我們才希望出現在你的收件匣。</p>
    <div class="keep-box">
      <strong>保留訂閱，你仍會收到</strong>
      <ul><li>新文章與重要醫學整理</li><li>SIGN WELL Letter 的主題精選</li><li>可隨時再次從任何電子報底部取消</li></ul>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="keepBtn">繼續訂閱</button>
      <button type="button" class="secondary" id="continueCancelBtn">仍要取消</button>
    </div>
  </section>
  <section id="reasonStep" class="hidden">
    <h1>在離開之前</h1>
    <p class="copy">如果願意，告訴我們原因。這不會影響你取消訂閱，也可以直接跳過。</p>
    <div class="reason-panel">
      <div class="reason-title">取消訂閱原因</div>
      <div class="reason-list">
        <label class="reason-option"><input type="radio" name="reason" value="too-frequent">寄送太頻繁</label>
        <label class="reason-option"><input type="radio" name="reason" value="not-relevant">內容與我的需求不符</label>
        <label class="reason-option"><input type="radio" name="reason" value="temporary">暫時不想收到</label>
        <label class="reason-option"><input type="radio" name="reason" value="web-only">我比較想直接在網站閱讀</label>
        <label class="reason-option"><input type="radio" name="reason" value="other">其他</label>
      </div>
      <textarea id="reasonNote" maxlength="240" placeholder="其他想告訴 SIGN WELL 的內容（選填）"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="secondary" id="backBtn">返回</button>
      <button type="button" class="danger-soft" id="unsubscribeBtn">確認取消訂閱</button>
    </div>
    <button type="button" class="skip" id="skipBtn">不填原因，直接取消</button>
  </section>
  <section id="resultStep" class="hidden">
    <h1 id="resultTitle">正在同步</h1>
    <p class="copy" id="resultCopy">正在更新你的電子報設定。</p>
    <div class="email" id="email"></div>
    <div class="actions">
      <a class="primary" href="index.html">回到 SIGN WELL</a>
      <a class="secondary" href="newsletter.html">重新訂閱</a>
    </div>
  </section>
  <div class="note">這是隱藏設定頁，不會出現在網站導覽。取消訂閱只會停止電子報，不影響網站瀏覽。</div>
</main>
<script>
const FALLBACK_ENDPOINT='https://script.google.com/macros/s/AKfycbzmZXZSepxCD1jbfpjMxsnvn0nRl-xEpeXdJoTO-TZL6Z5Zk7T-OsVGpTkIxWaCh-Y/exec';
const params=new URLSearchParams(location.search);
const token=params.get('t')||'';
function endpoint(){
  const cfg=window.SIGNWELL_NEWSLETTER||window.SIGNWELL_ANALYTICS||{};
  const url=String(cfg.endpoint||FALLBACK_ENDPOINT).trim();
  return /^https:\/\/script\.google\.com\/macros\/s\//i.test(url)?url:FALLBACK_ENDPOINT;
}
function gasBridge(action,payload={},timeoutMs=45000){
  return new Promise((resolve,reject)=>{
    const requestId='swu_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
    const frameName='swuframe_'+requestId;
    const iframe=document.createElement('iframe');
    iframe.name=frameName;iframe.tabIndex=-1;iframe.setAttribute('aria-hidden','true');
    Object.assign(iframe.style,{position:'fixed',width:'1px',height:'1px',opacity:'0',pointerEvents:'none',left:'-9999px',top:'-9999px'});
    const form=document.createElement('form');
    form.method='POST';form.action=endpoint();form.target=frameName;form.style.display='none';
    const add=(name,value)=>{const i=document.createElement('input');i.type='hidden';i.name=name;i.value=String(value??'');form.appendChild(i)};
    add('transport','iframe');add('requestId',requestId);add('returnOrigin',location.origin);add('action',action);add('payload',JSON.stringify(payload||{}));
    let timer=0;
    const cleanup=()=>{clearTimeout(timer);window.removeEventListener('message',onMessage);form.remove();setTimeout(()=>iframe.remove(),40)};
    const onMessage=e=>{const d=e.data;if(!d||d.source!=='SIGNWELL_GAS'||d.requestId!==requestId)return;cleanup();d.ok?resolve(d.data||{}):reject(new Error(d.error||'SIGN WELL Backend error'))};
    window.addEventListener('message',onMessage);
    timer=setTimeout(()=>{cleanup();reject(new Error('取消訂閱同步逾時，請稍後再試。'))},timeoutMs);
    document.body.append(iframe,form);form.submit();
  });
}
function showOnly(id){['retentionStep','reasonStep','resultStep'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function setResult(title,copy,email='',kind='success'){
  showOnly('resultStep');document.getElementById('resultTitle').textContent=title;document.getElementById('resultCopy').textContent=copy;
  const em=document.getElementById('email');if(email){em.textContent=email;em.classList.add('show')}else{em.classList.remove('show')}
  const icon=document.getElementById('statusIcon');
  if(kind==='loading')icon.innerHTML='<div class="spinner" aria-hidden="true"></div>';
  else if(kind==='error')icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 17h.01"/></svg>';
  else icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>';
}
async function unsubscribe(reason='skipped'){
  if(!token){setResult('連結無效','這個取消訂閱連結缺少必要憑證。','','error');return}
  setResult('正在取消訂閱','正在同步你的設定，完成後就不會再收到 SIGN WELL Letter。','','loading');
  try{
    const note=reason==='skipped'?'':String(document.getElementById('reasonNote')?.value||'').trim();
    const result=await gasBridge('newsletter.unsubscribe',{token,reason,note});
    try{
      localStorage.removeItem('signwell-newsletter-subscribed');
      localStorage.setItem('signwell-newsletter-last-result',JSON.stringify({ok:true,at:Date.now(),status:'unsubscribed'}));
    }catch(_){}
    try{history.replaceState(null,'',location.pathname)}catch(_){}
    setResult('已取消訂閱',result.message||'已同步完成。之後不會再寄送 SIGN WELL 電子報到這個信箱。',result.emailMasked||'','success');
  }catch(err){setResult('無法完成取消訂閱',String(err?.message||err||'系統暫時無法同步，請稍後再試。'),'','error')}
}
document.getElementById('keepBtn').onclick=()=>setResult('已保留訂閱','你的訂閱沒有任何變更。下一封值得讀的內容，我們再見。','','success');
document.getElementById('continueCancelBtn').onclick=()=>showOnly('reasonStep');
document.getElementById('backBtn').onclick=()=>showOnly('retentionStep');
document.getElementById('unsubscribeBtn').onclick=()=>unsubscribe(document.querySelector('input[name="reason"]:checked')?.value||'skipped');
document.getElementById('skipBtn').onclick=()=>unsubscribe('skipped');
if(params.get('preview')==='1')setResult('取消訂閱設定頁','這是電子報預覽／測試連結，不會變更任何人的訂閱狀態。','','success');
else if(!token)setResult('連結無效','請從你收到的 SIGN WELL 電子報底部重新開啟「取消訂閱」。','','error');
</script>

<script id="swPublicStabilityRuntime">
(() => {
  const root=document.documentElement;
  const lowMemory=(Number(navigator.deviceMemory||8)<=4);
  const lowCPU=(Number(navigator.hardwareConcurrency||8)<=4);
  const saveData=Boolean(navigator.connection&&navigator.connection.saveData);
  if(lowMemory||lowCPU||saveData)root.classList.add('sw-lowfx');

  const syncVisibility=()=>{
    document.body?.classList.toggle('sw-page-hidden',document.hidden);
  };
  document.addEventListener('visibilitychange',syncVisibility,{passive:true});
  syncVisibility();
})();
</script>
