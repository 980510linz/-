<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#edf2ef">
<title>401 · SIGN WELL</title>
<link rel="stylesheet" href="../assets/components/shared/14-signwell-error-experience-v24.10.0.css?build=24.10.0-STAGING">
<link rel="stylesheet" href="../assets/signwell-liquid-glass-v24.12.css">
<link rel="stylesheet" href="../assets/signwell-mobile-guard.css">
</head>
<body style="margin:0;background:#edf2ef">
<main id="swErrorRoot"></main>
<script src="../assets/bundles/error-experience-v24.10.0.js?build=24.10.0-STAGING"></script>
<script>
(()=>{
 const root=document.getElementById('swErrorRoot');
 const params=new URLSearchParams(location.search);
 const fixedStatus=401;
 const code=(params.get('code')||'SW-PUB-401-AUTH-REQUIRED').toUpperCase();
 const moduleName=(params.get('module')||'authentication').slice(0,80);
 const reason=(params.get('reason')||'目前工作階段無法完成這個操作，請重新登入後再試。').slice(0,260);
 window.SignWellErrors.renderInto(root,new Error(reason),{surface:'PUB',status:fixedStatus,errorCode:code,module:moduleName,action:'static-error-page',homeUrl:'../index.html',retryable:false});
})();
</script>
<script src="../assets/signwell-liquid-glass-v24.12.js" defer></script>
</body>
</html>
