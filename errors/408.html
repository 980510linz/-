<title>408 · SIGN WELL</title>

<link rel="stylesheet" href="../assets/signwell-liquid-glass-v24.12.css">

<body style="margin:0;background:#edf2ef">
<main id="swErrorRoot"></main>
<script src="../assets/bundles/error-experience-v24.10.0.js?build=24.10.0-STAGING"></script>
<script>
(()=>{
 const root=document.getElementById('swErrorRoot');
 const params=new URLSearchParams(location.search);
 const fixedStatus=408;
 const code=(params.get('code')||'SW-PUB-408-REQUEST-TIMEOUT').toUpperCase();
 const moduleName=(params.get('module')||'network').slice(0,80);
 const reason=(params.get('reason')||'瀏覽器等待要求完成時超過期限。').slice(0,260);
 window.SignWellErrors.renderInto(root,new Error(reason),{surface:'PUB',status:fixedStatus,errorCode:code,module:moduleName,action:'static-error-page',homeUrl:'../index.html',retryable:true});
})();
</script>
<script src="../assets/signwell-liquid-glass-v24.12.js" defer></script>
</body>
