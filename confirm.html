::view-transition-new(root){animation-name:swThemeReveal}
@keyframes swThemeOld{to{opacity:.72;filter:saturate(.88) brightness(.96)}}
@keyframes swThemeReveal{from{clip-path:circle(0 at var(--sw-theme-x) var(--sw-theme-y));filter:saturate(.82) brightness(.96)}to{clip-path:circle(150vmax at var(--sw-theme-x) var(--sw-theme-y));filter:none}}
